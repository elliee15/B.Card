<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>B.Card</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(120deg,#ff9a9e,#fad0c4,#fad0c4);
  background-size:300% 300%;
  animation:bgMove 8s infinite;
  font-family:sans-serif;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.card{
  background:white;
  padding:2rem 3rem;
  border-radius:20px;
  text-align:center;
}
button{
  border:none;
  background:#ff6f91;
  color:white;
  padding:10px 20px;
  border-radius:20px;
}
</style>
</head>

<body>

<div class="card">
  <h1>Coming Soon</h1>
  <p>Website is under construction.</p>
  <button onclick="playMusic()">Play Music 🎵</button>
</div>

<audio id="bgMusic" loop>
  <source src="Birthday.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic(){
  document.getElementById("bgMusic").play();
}
</script>

</body>
</html>
